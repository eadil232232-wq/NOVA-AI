
name: Prepare Cloudflare AI dependencies

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Cloudflare AI dependencies
        run: pnpm add agents@latest @ai-sdk/provider@^4

      - name: Build project
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Create dependency update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/cloudflare-ai-dependencies
          delete-branch: true
          title: "Add Cloudflare Workers AI dependencies"
          commit-message: "Add Cloudflare Workers AI dependencies"
          body: |
            Adds the Cloudflare Agents SDK and AI SDK provider dependency.
            Updates pnpm-lock.yaml and verifies the production build.
